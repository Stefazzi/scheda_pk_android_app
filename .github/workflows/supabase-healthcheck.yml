name: Supabase healthcheck

on:
  workflow_dispatch:
  schedule:
    # UTC, fuori dall'inizio dell'ora: 3 controlli al giorno.
    - cron: '23 5,13,21 * * *'

permissions:
  contents: read

concurrency:
  group: supabase-healthcheck
  cancel-in-progress: false

jobs:
  healthcheck:
    environment: Pokerole_Supabase_DB
    runs-on: ubuntu-24.04
    timeout-minutes: 3
