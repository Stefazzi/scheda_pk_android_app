name: Supabase healthcheck

on:
  workflow_dispatch:
  schedule:
    # UTC, fuori dall'inizio dell'ora: 3 controlli al giorno.
    - cron: '23 5,13,21 * * *'

permissions:
  contents: read

concurrency:
  group: supabase-healthcheck
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test del controllo (senza rete)
        run: python3 -B -m unittest discover -s scripts -p 'test_supabase_healthcheck.py' -v
      - name: Verifica Data API e database
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: python3 -B scripts/supabase_healthcheck.py
